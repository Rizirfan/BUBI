<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pumpkinBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A34"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="256" y1="90" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="subtleShadow" x="80" y="80" width="352" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
  </defs>

  {/* Squircle Base */}
  <rect width="512" height="512" rx="128" fill="url(#pumpkinBg)"/>

  {/* Messenger Icon Graphic */}
  <g filter="url(#subtleShadow)">
    {/* Main Speech Bubble forming stylized "B" silhouette */}
    <path d="M140 180C140 135.817 175.817 100 220 100H292C336.183 100 372 135.817 372 180V220C372 264.183 336.183 300 292 300H236L182 344V300H180C157.909 300 140 282.091 140 260V180Z" fill="url(#innerGlow)"/>
    
    {/* Secondary dynamic speech bubble tail / loop giving friendly B character */}
    <circle cx="216" cy="200" r="22" fill="#EA580C"/>
    <circle cx="288" cy="200" r="22" fill="#EA580C"/>
    
    {/* Happy conversation arc */}
    <path d="M216 236C228 252 276 252 288 236" stroke="#EA580C" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
